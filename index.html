        // --- UTILS ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } else {
                console.warn("Speech Synthesis not supported");
            }
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // --- TABS LOGIC ---
        function renderTabs() {
            const desktopContainer = document.getElementById('desktop-tabs');
            const mobileSelect = document.getElementById('mobile-tabs');
            
            TABS.forEach(tab => {
                // Desktop
                const btn = document.createElement('button');
                btn.className = `tab-btn flex items-center gap-2 px-4 py-2 rounded-full font-medium transition-all duration-300 border bg-white/5 text-gray-400 border-transparent hover:bg-white/10 hover:text-white`;
                btn.id = `btn-${tab.id}`;
                btn.onclick = () => switchTab(tab.id);
                btn.innerHTML = `<i data-lucide="${tab.icon}" class="w-5 h-5"></i><span>${tab.label}</span>`;
                desktopContainer.appendChild(btn);

                // Mobile
                const opt = document.createElement('option');
                opt.value = tab.id;
                opt.textContent = tab.label;
                mobileSelect.appendChild(opt);
            });

            mobileSelect.addEventListener('change', (e) => {
                switchTab(e.target.value);
            });
        }

        function switchTab(tabId) {
            activeTab = tabId;
            
            // Update panes
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');

            // Update desktop buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = `tab-btn flex items-center gap-2 px-4 py-2 rounded-full font-medium transition-all duration-300 border bg-white/5 text-gray-400 border-transparent hover:bg-white/10 hover:text-white`;
            });
            const activeBtn = document.getElementById(`btn-${tabId}`);
            if(activeBtn) {
                activeBtn.className = `tab-btn flex items-center gap-2 px-4 py-2 rounded-full font-medium transition-all duration-300 border bg-emerald-500/20 text-emerald-300 border-emerald-500/50 shadow-[0_0_15px_rgba(16,185,129,0.2)]`;

            document.getElementById('fc-uz').innerText = `🇺🇿 ${word.uz}`;

        // --- VOCAB QUIZ LOGIC ---
        function initVocabQuiz() {
            vocabQs = shuffleArray([...VOCABULARY]).map(word => {
                const wrongOptions = shuffleArray(VOCABULARY.filter(v => v.id !== word.id)).slice(0, 3).map(v => v.uz);
                return {
                    word: word,
                    options: shuffleArray([word.uz, ...wrongOptions])
                };
            });
            vocabCurrentQ = 0;
            vocabScore = 0;
            vocabSelectedOpt = null;
            renderVocabQuiz();
        }

        function renderVocabQuiz() {
            const container = document.getElementById('vocab-quiz-container');
            if (vocabCurrentQ >= vocabQs.length) {
                // Show Result
                container.innerHTML = `
                    <div class="bg-white/10 backdrop-blur border border-white/20 p-8 rounded-2xl text-center max-w-md mx-auto mt-10">

                        <h2 class="text-3xl font-bold text-white mb-2">Natija</h2>
                        <p class="text-xl text-gray-300 mb-6">Siz ${vocabQs.length} tadan ${vocabScore} ta to'g'ri topdingiz!</p>
                        <button onclick="initVocabQuiz()" class="flex items-center justify-center gap-2 w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-white font-semibold transition">
                            <i data-lucide="rotate-ccw" class="w-5 h-5"></i> Qayta boshlash
                        </button>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const q = vocabQs[vocabCurrentQ];
            let html = `
                <div class="flex justify-between text-white/60 mb-4 font-mono">
                    <span>Savol: ${vocabCurrentQ + 1}/${vocabQs.length}</span>
                    <span>Ball: ${vocabScore}</span>
                </div>
                <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-2xl p-8 mb-6 text-center relative overflow-hidden">
                    <h2 class="text-8xl font-bold text-white mb-4">${q.word.hanzi}</h2>
                    <p class="text-gray-400">Ushbu so'zning ma'nosini toping</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            `;

            q.options.forEach(opt => {
                let btnClass = "bg-white/10 hover:bg-white/20 text-white";
                if (vocabSelectedOpt) {
                    if (opt === q.word.uz) btnClass = "bg-emerald-500/80 text-white border-emerald-400";
                    else if (opt === vocabSelectedOpt) btnClass = "bg-red-500/80 text-white border-red-400";
                    else btnClass = "opacity-50 bg-white/5 text-white";
                }
                const disabled = vocabSelectedOpt ? 'disabled' : '';
                html += `<button onclick="handleVocabSelect('${opt.replace(/'/g, "\\'")}')" class="p-4 rounded-xl border border-transparent font-medium text-lg transition-all ${btnClass}" ${disabled}>${opt}</button>`;
            });
            html += `</div>`;
            container.innerHTML = html;
            lucide.createIcons();
        }

        function handleVocabSelect(opt) {
            if (vocabSelectedOpt) return;
            vocabSelectedOpt = opt;
            const q = vocabQs[vocabCurrentQ];
            if (opt === q.word.uz) vocabScore++;
            renderVocabQuiz(); // Re-render to show colors

            setTimeout(() => {
                vocabCurrentQ++;
                vocabSelectedOpt = null;
                renderVocabQuiz();
            }, 1200);
        }

        function initGrammarQuiz() {

            gramScore = 0;
            gramSelectedOpt = null;

        function renderGrammarQuiz() {
            const container = document.getElementById('grammar-quiz-container');
            if (gramCurrentQ >= gramQs.length) {
                // Show Result
                container.innerHTML = `

                </div>

            `;

            q.options.forEach(opt => {
                let btnClass = "bg-white/10 hover:bg-white/20 text-white";

                    if (opt === q.answer) btnClass = "bg-emerald-500/80 text-white border-emerald-400";
                    else if (opt === gramSelectedOpt) btnClass = "bg-red-500/80 text-white border-red-400";
                    else btnClass = "opacity-50 bg-white/5 text-white";
                }
                const disabled = gramSelectedOpt ? 'disabled' : '';
                html += `<button onclick="handleGrammarSelect('${opt}')" class="p-5 rounded-xl border border-transparent font-medium text-2xl transition-all ${btnClass}" ${disabled}>${opt}</button>`;

        function handleGrammarSelect(opt) {

            gramSelectedOpt = opt;
            const q = gramQs[gramCurrentQ];
            if (opt === q.answer) gramScore++;
            renderGrammarQuiz();

            setTimeout(() => {
                gramCurrentQ++;
                gramSelectedOpt = null;
                renderGrammarQuiz();
            }, 1500);
        }

        // --- FILL BLANKS LOGIC ---
        function initFillBlanks() {
            fillAnswers = Array(FILL_BLANKS.length).fill('');
            fillSubmitted = false;
            
            // Render Words Bank
            const bankContainer = document.getElementById('fill-words-bank');
            bankContainer.innerHTML = FILL_WORDS_BANK.map(w => `<span class="px-3 py-1 bg-white/10 rounded-lg text-emerald-300 font-medium">${w}</span>`).join('');
            
            renderFillBlanksList();
        }

        function renderFillBlanksList() {
            const container = document.getElementById('fill-blanks-container');
            let html = '';
            
            FILL_BLANKS.forEach((item, i) => {
                const isCorrect = fillAnswers[i] === item.answer;
                let selectClass = "bg-slate-800 border-2 rounded-lg px-2 py-1 text-emerald-400 outline-none min-w-[100px] text-center " + 
                                  (fillSubmitted 
                                    ? (isCorrect ? 'border-emerald-500 bg-emerald-500/20' : 'border-red-500 bg-red-500/20') 
                                    : 'border-white/20 focus:border-emerald-500');
                
                let optionsHtml = `<option value="" disabled ${fillAnswers[i] === '' ? 'selected' : ''}></option>`;
                FILL_WORDS_BANK.forEach(w => {
                    optionsHtml += `<option value="${w}" ${fillAnswers[i] === w ? 'selected' : ''}>${w}</option>`;
                });

                let resultIcon = '';
                let correction = '';
                if (fillSubmitted) {
                    resultIcon = isCorrect ? `<i data-lucide="check-circle-2" class="text-emerald-500 ml-auto w-6 h-6"></i>` : `<i data-lucide="x-circle" class="text-red-500 ml-auto w-6 h-6"></i>`;
                    if(!isCorrect) correction = `<span class="text-emerald-400 text-sm ml-2">(To'g'ri: ${item.answer})</span>`;
                }

                html += `
                    <div class="flex items-center flex-wrap gap-2 text-xl text-white bg-white/5 p-4 rounded-lg">
                        <span class="text-white/40 text-sm font-mono mr-2">${i+1}.</span>
                        <span>${item.before}</span>
                        <select onchange="updateFillAnswer(${i}, this.value)" ${fillSubmitted ? 'disabled' : ''} class="${selectClass}">
                            ${optionsHtml}
                        </select>
                        <span>${item.after}</span>
                        ${resultIcon}
                        ${correction}
                    </div>
                `;
            });
            container.innerHTML = html;
            
            // Check button state
            const btn = document.getElementById('fill-submit-btn');
            if (fillSubmitted) {
                let s = fillAnswers.filter((a, i) => a === FILL_BLANKS[i].answer).length;
                document.getElementById('fill-blanks-footer').innerHTML = `
                    <div class="text-2xl text-white font-bold">Natija: <span class="text-emerald-400">${s} / ${FILL_BLANKS.length}</span></div>
                    <button onclick="initFillBlanks()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-semibold flex items-center gap-2 transition">
                        <i data-lucide="rotate-ccw" class="w-5 h-5"></i> Qayta urinish
                    </button>
                `;
            } else {
                const isAllFilled = fillAnswers.every(a => a !== '');
                btn.disabled = !isAllFilled;
            }
            lucide.createIcons();
        }

        function updateFillAnswer(index, val) {
            if(fillSubmitted) return;
            fillAnswers[index] = val;
            renderFillBlanksList();
        }

        function checkFillAnswers() {
            fillSubmitted = true;
            renderFillBlanksList();
        }

        // --- STATIC CONTENT RENDERERS ---
        function renderStaticContent() {
            // Dialogues
            const dContainer = document.getElementById('dialogues-container');
            let dHtml = '';
            DIALOGUES.forEach(dialogue => {
                let linesHtml = dialogue.lines.map(line => `
                    <div class="flex gap-4 items-start p-3 rounded-lg hover:bg-white/5 transition">
                        <button onclick="speak('${line.hanzi.replace(/'/g, "\\'")}')" class="mt-1 flex-shrink-0 p-2 bg-emerald-500/20 hover:bg-emerald-500/40 text-emerald-300 rounded-full transition">
                            <i data-lucide="volume-2" class="w-5 h-5"></i>
                        </button>
                        <div>
                            <span class="inline-block px-2 py-1 bg-white/10 text-white/70 text-xs rounded mb-2 font-bold">${line.speaker}</span>
                            <p class="text-2xl text-white font-medium mb-1">${line.hanzi}</p>
                            <p class="text-emerald-300/80 mb-2 font-mono text-sm">${line.pinyin}</p>
                            <p class="text-yellow-300 text-sm mb-1">🇺🇿 ${line.uz}</p>
                            <p class="text-blue-300/70 text-sm mb-1">🇷🇺 ${line.ru}</p>
                            <p class="text-gray-400 text-sm">🇬🇧 ${line.en}</p>
                        </div>
                    </div>
                `).join('');

                dHtml += `
                    <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl overflow-hidden">
                        <div class="bg-white/10 p-4 border-b border-white/10">
                            <h3 class="text-xl font-bold text-emerald-400">${dialogue.title}</h3>
                            <p class="text-yellow-300/80 mt-1">${dialogue.uzTitle}</p>
                        </div>
                        <div class="p-4 space-y-4">
                            ${linesHtml}
                        </div>
                    </div>
                `;
            });
            dContainer.innerHTML = dHtml;

            // Grammar Explanations
            const gContainer = document.getElementById('grammar-container');
            let gHtml = '';
            GRAMMAR.forEach(gram => {
                let examplesHtml = gram.examples.map(ex => `
                    <div class="pl-4 border-l-2 border-emerald-500/50">
                        <p class="text-xl text-white mb-1 flex items-center gap-2">
                            ${ex.hanzi}
                            <button onclick="speak('${ex.hanzi.replace(/'/g, "\\'")}')" class="text-emerald-400/50 hover:text-emerald-400">
                                <i data-lucide="volume-2" class="w-4 h-4"></i>
                            </button>
                        </p>
                        <p class="text-emerald-300/70 text-sm mb-1">${ex.pinyin}</p>
                        <p class="text-yellow-300/80 text-sm">${ex.uz}</p>
                    </div>
                `).join('');

                gHtml += `
                    <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-6">
                        <h3 class="text-2xl font-bold text-emerald-400 mb-4">${gram.title}</h3>
                        <div class="space-y-3 mb-6 bg-black/20 p-4 rounded-xl">
                            <p class="text-yellow-300 leading-relaxed"><span class="font-bold opacity-50">🇺🇿 UZ:</span> ${gram.desc_uz}</p>
                            <p class="text-blue-300/80 leading-relaxed"><span class="font-bold opacity-50">🇷🇺 RU:</span> ${gram.desc_ru}</p>
                            <p class="text-gray-300 leading-relaxed"><span class="font-bold opacity-50">🇬🇧 EN:</span> ${gram.desc_en}</p>
                        </div>
                        <h4 class="text-lg font-semibold text-white mb-3">Misollar / Examples:</h4>
                        <div class="space-y-4">
                            ${examplesHtml}
                        </div>
                    </div>
                `;
            });
            gContainer.innerHTML = gHtml;
        }
    </script>
</body>
</html>
